name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip TezKorBooster-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: cd TezKorBooster && gradle wrapper --gradle-version 8.7
      - run: cd TezKorBooster && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TezKorBooster-apk
          path: TezKorBooster/app/build/outputs/apk/debug/app-debug.apk
